name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release
        run: |
          xcodebuild \
            -project AlienMAC.xcodeproj \
            -scheme AlienMAC \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/AlienMAC.app \
            dist/AlienMAC.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AlienMAC
          path: dist/AlienMAC.app.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: actions/download-artifact@v4
        with:
          name: AlienMAC
          path: dist

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "AlienMAC ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" dist/AlienMAC.app.zip --clobber
